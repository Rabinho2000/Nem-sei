name: nemsei-v2

# Deploy/redeploy canonically with every override this environment currently
# has active, or a redeploy silently drops whatever env vars only exist in
# an omitted override -- found live, 2026-08-21 (D3): redeploying web/worker
# /scheduler with only this file, forgetting
# `docker-compose.v2.diagnostic-incidents.yml`, silently turned the D1
# incident evaluator off for ~12 minutes with no error, only caught by
# checking `schedule_state` directly. See
# docs/v2/DIAGNOSTICS_PORTFOLIO_TELEGRAM_PLAN.md's D3 write-up.
#
# As of 2026-08-21, the canonical `up -d` for `web`/`worker`/`scheduler` is:
#   docker compose -f docker-compose.v2.yml \
#     -f docker-compose.v2.diagnostic-incidents.yml \
#     --env-file .env.v2 up -d --build web worker scheduler
# `docker-compose.v2.device-status-canary.yml` exists but is NOT currently
# applied in production (docs/v2/DEVICE_TELEMETRY.md ss10, still blocked) --
# do not add it to the command above without that separate approval.

x-v2-environment: &v2-environment
  NEMSEI_V2_DATABASE_URL_FILE: /run/secrets/v2_database_url

# FusionSolar-call environment shared by worker and scheduler only (web and
# migrate never call a provider). NEMSEI_V1_OWNERSHIP_BROKER_URL points at
# the separate nemsei-v1-fusionsolar-broker container
# (docker-compose.v1-ownership-broker.yml) over the Docker bridge gateway --
# deliberately not a volume mount of V1's runtime data here, so
# scripts/verify_v2_runtime_isolation.py's ban on this file naming V1's
# storage location stays meaningful. See docs/v2/FUSIONSOLAR_OWNERSHIP_WINDOW.md.
x-v2-fusionsolar-environment: &v2-fusionsolar-environment
  NEMSEI_V2_PROVIDER_READS: "true"
  NEMSEI_V1_OWNERSHIP_BROKER_URL: http://host.docker.internal:8765
  NEMSEI_V1_OWNERSHIP_BROKER_TOKEN_FILE: /run/secrets/v1_broker_token
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_USERNAME_FILE: /run/secrets/fusionsolar_primary_username
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_PASSWORD_FILE: /run/secrets/fusionsolar_primary_password
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_BASE_URL: https://eu5.fusionsolar.huawei.com
  # Operator-verified production contract (docs/v2/FUSIONSOLAR_CANARY.md):
  # the account labels its daily KPI buckets by UTC midnight, and PVYield is
  # verified kWh. production_contract_for() in production.py refuses to run
  # without both of these -- a missing verification is a safe configuration
  # failure, never a silently guessed unit or window.
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_PRODUCTION_TIMEZONE: UTC
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_PRODUCTION_UNIT: kWh
  # Same operator-verified contract, for device_contract_for() in
  # device_status.py: V1 guessed active power's unit from its own
  # magnitude, so this is required explicitly rather than inferred.
  # 2026-08-24 cutover: values confirmed by the FusionSolar canary runs.
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_DEVICE_POWER_UNIT: kW
  NEMSEI_V2_FUSIONSOLAR_PRIMARY_DEVICE_ENERGY_UNIT: kWh
  # 2026-08-24 cutover: turn on the one scheduler-driven FusionSolar
  # capability approved for normal operation -- daily incremental
  # production sync against the single configured connection (id 3).
  # Device-status polling and the diagnostics/notifications schedulers
  # stay off; those still need their own separate approval (see the
  # header comment above and docs/v2/DEVICE_TELEMETRY.md ss10).
  NEMSEI_V2_PRODUCTION_SYNC_SCHEDULER_ENABLED: "true"
  NEMSEI_V2_PRODUCTION_SYNC_SCHEDULER_CONNECTION_ID: "3"
  # 2026-08-25: sonda de dispositivos ligada. Estava parada desde 2026-08-20, e
  # era essa a raiz do silencio no Telegram -- sem leituras novas nao ha regras
  # a disparar, sem regras nao ha incidentes, sem incidentes nao ha alertas.
  #
  # Custo medido, nao estimado: um ciclo bem sucedido gastou 3 chamadas
  # (sync run 10, 2026-08-20) para os 2 inversores activos da ligacao 3. A 30
  # minutos sao 48 ciclos/dia, ~144 chamadas/dia -- mas o travao desta conta e
  # de *frequencia*, nao de volume: recuperou em ~10 minutos depois de 25
  # chamadas seguidas, e 3 chamadas a cada meia hora nao se parece com isso.
  # A cadencia de 30 min e a que o canario provou (DEVICE_TELEMETRY.md ss8) e a
  # que a regra de completude de 90 minutos da disponibilidade exige.
  #
  # O cap e vitalicio e conta os 3 ciclos ja corridos: 1443 = 30 dias a 48/dia
  # mais esses 3. Nao e um numero grande para desligar o travao -- e um ponto
  # de paragem deliberado por volta de 2026-09-24, para alguem decidir de novo.
  NEMSEI_V2_DEVICE_STATUS_POLL_ENABLED: "true"
  NEMSEI_V2_DEVICE_STATUS_POLL_CONNECTION_ID: "3"
  NEMSEI_V2_DEVICE_STATUS_POLL_INTERVAL_MINUTES: "30"
  NEMSEI_V2_DEVICE_STATUS_POLL_MAX_CYCLES: "1443"
  # 2026-08-25: estado das centrais. A sonda de dispositivos acima cobre 2
  # inversores de UMA estacao; isto cobre as 134 centrais mapeadas, que e a
  # pergunta que o alerta de queda precisa e a que a V1 respondia e a V2 nao.
  #
  # Custo medido, nao estimado: uma corrida manual a 2026-08-25 leu 134
  # centrais em 2 chamadas em lote (o endpoint aceita 100 por chamada) mais um
  # login em cache -- 132 aceites, 104 operacionais, 24 sem comunicacao, 3 em
  # avaria. A 15 minutos sao ~8 chamadas/hora para a frota inteira, menos do
  # que a sonda de dispositivos gasta em 2 inversores.
  #
  # E uma faixa de limite separada: provider_request_states conta por familia
  # de endpoint, e `current_monitoring` da ligacao 3 nao tem cooldown nenhum,
  # enquanto quem apanha rate_limited hoje e `device_discovery` e
  # `device_current_monitoring`. Isto nao compete com o orcamento da sonda.
  #
  # Sem cap vitalicio, ao contrario da sonda: nao e um canario com fim
  # marcado, e a capacidade de que depende o alerta de queda.
  NEMSEI_V2_CURRENT_MONITORING_SCHEDULER_ENABLED: "true"
  NEMSEI_V2_CURRENT_MONITORING_SCHEDULER_CONNECTION_ID: "3"
  NEMSEI_V2_CURRENT_MONITORING_SCHEDULER_INTERVAL_MINUTES: "15"

# Notificacoes (D4, 2026-08-25). Ancora separada da do FusionSolar de proposito:
# nada disto e uma chamada a provider, e misturar as duas faria um leitor futuro
# pensar que sim. Sem o segredo montado, telegram_client.py cai para o mock e o
# processo nao consegue enviar -- a garantia que substituiu o "nao existe codigo
# HTTP" do D3. Ensaio antes de ligar: decide_notification_events criaria 0
# eventos, porque os 644 incidentes abertos sao anteriores a baseline das
# politicas; so incidentes novos passam a alertar.
# Sigenergy (2026-08-25). Conta e endpoints proprios, sem relacao com a conta
# partilhada do FusionSolar -- nao passa pelo broker de lease nem tem contencao
# com o V1. As chaves vem de segredos montados; os endpoints nao sao segredo.
# A V2 implementa validacao, descoberta e monitorizacao corrente para este
# provider. NAO implementa historico de producao: nao existe metodo no cliente
# nem capacidade registada, e o contrato de dia-fonte/fuso nunca foi verificado.
x-v2-sigenergy-environment: &v2-sigenergy-environment
  NEMSEI_V2_SIGENERGY_PRIMARY_APP_KEY_FILE: /run/secrets/sigenergy_primary_app_key
  NEMSEI_V2_SIGENERGY_PRIMARY_APP_SECRET_FILE: /run/secrets/sigenergy_primary_app_secret
  NEMSEI_V2_SIGENERGY_PRIMARY_BASE_URL: https://api-eu.sigencloud.com
  NEMSEI_V2_SIGENERGY_PRIMARY_AUTH_ENDPOINT: /openapi/auth/login/key
  # /openapi/system, nao /openapi/system/list: o segundo devolve HTTP 200 com
  # corpo vazio, e era por isso que a descoberta parecia nao existir neste
  # provider. O V1 sempre usou o primeiro. Devolve systemId, systemName, addr,
  # timeZone, pvCapacity e estado por sistema.
  NEMSEI_V2_SIGENERGY_PRIMARY_SYSTEMS_ENDPOINT: /openapi/system
  NEMSEI_V2_SIGENERGY_PRIMARY_ENERGY_FLOW_ENDPOINT: /openapi/systems/{system_id}/energyFlow
  NEMSEI_V2_SIGENERGY_PRIMARY_REGION: eu
  # Contrato de producao verificado em 2026-08-25 contra a API real, nao
  # assumido: os dias 2026-08-18, 08-17 e 08-14 devolveram 636.87, 686.44 e
  # 236.89 kWh, exactamente os valores que o V1 tinha registado para esses
  # dias -- tres em tres, incluindo um dia anomalo baixo. O balanco tambem
  # fecha: autoconsumo 411.28 + injeccao 225.60 = 636.88, a producao a menos
  # de um centimo de arredondamento. Sem estas duas variaveis o servico
  # recusa-se a correr, em vez de adivinhar como o V1 faz.
  NEMSEI_V2_SIGENERGY_PRIMARY_PRODUCTION_TIMEZONE: Europe/Lisbon
  NEMSEI_V2_SIGENERGY_PRIMARY_PRODUCTION_UNIT: kWh
  # Agendamento proprio: conta separada, limites separados, interruptor
  # separado. Ligacao 5 (sigen-live). Um so sistema activo hoje, porque os
  # outros dois nunca foram aprovados pelo cliente no onboarding do V1.
  NEMSEI_V2_SIGENERGY_SYNC_SCHEDULER_ENABLED: "true"
  NEMSEI_V2_SIGENERGY_SYNC_SCHEDULER_CONNECTION_ID: "5"
  # Estado das centrais, mesma cadencia da conta FusionSolar mas interruptor
  # proprio -- conta separada, limites separados. Uma chamada por central (o
  # energyFlow nao aceita lote), portanto 2 chamadas por ciclo hoje.
  # O energyFlow nao traz campo de estado nenhum: o `operational` vem da
  # potencia gerada, e a noite fica `unknown` sem gerar incidente.
  NEMSEI_V2_SIGENERGY_CURRENT_MONITORING_SCHEDULER_ENABLED: "true"
  NEMSEI_V2_SIGENERGY_CURRENT_MONITORING_SCHEDULER_CONNECTION_ID: "5"
  NEMSEI_V2_SIGENERGY_CURRENT_MONITORING_SCHEDULER_INTERVAL_MINUTES: "15"

# Huawei SCADA (docs/v2/HUAWEI_SCADA.md). Ancora separada porque este provider
# nao se parece com nenhum dos outros: nao ha conta, nao ha credencial e nao ha
# chamada de saida nenhuma. O SDongle e que liga a este servidor, e o servidor
# responde com leituras Modbus. Nao ha edge collector, nao ha Pinggy, nao ha
# socat -- o unico caminho e o NAT do router para a porta publicada abaixo.
#
# Estas variaveis descrevem o *contrato verificado* dos registos, e o rollup
# recusa-se a correr sem elas -- e a mesma regra do FusionSolar e do Sigenergy.
# Nenhuma e segredo: sao a leitura de um numero inteiro com ganho 1000, e a
# decisao de qual registo conta como producao.
x-v2-huawei-scada-environment: &v2-huawei-scada-environment
  # Ganho 1000 sobre watts. Confirmar contra o mostrador do proprio inversor
  # antes de ligar: se este valor estiver errado, todos os kWh ficam errados
  # por um factor de mil e continuam a parecer plausiveis.
  NEMSEI_V2_HUAWEI_SCADA_PRIMARY_POWER_UNIT: kW
  # 37498 (entrada PV) ou 37516 (potencia activa total). Sao medicoes
  # diferentes -- diferem pelas perdas de conversao -- e nada no trafego
  # observado diz qual delas o relatorio deve chamar producao. Sem esta
  # variavel o rollup recusa correr, em vez de escolher uma.
  NEMSEI_V2_HUAWEI_SCADA_PRIMARY_PRODUCTION_SIGNAL: total_active_power
  # DELIBERADAMENTE POR PREENCHER no piloto. O registo 37502 e com sinal e nada
  # prova se positivo significa importar ou exportar. Enquanto isto estiver
  # vazio a V2 **nao escreve** export_energy nem grid_import_energy -- nao
  # inventa metade delas. Preencher com positive_import ou positive_export
  # depois de comparar uma hora de leituras com o contador real.
  # NEMSEI_V2_HUAWEI_SCADA_PRIMARY_GRID_SIGN_CONVENTION: positive_import
  # Autoconsumo derivado (consumo - importacao) so com a convencao acima
  # verificada, e mesmo assim o rollup salta qualquer dia em que a bateria
  # tenha movido energia: e a bateria que absorve a diferenca e parte a
  # identidade.
  # NEMSEI_V2_HUAWEI_SCADA_PRIMARY_SELF_USE_DERIVATION: consumption_minus_grid_import
  NEMSEI_V2_HUAWEI_SCADA_PRIMARY_MAX_SAMPLE_GAP_SECONDS: "900"
  # Rollup e limpeza: dois jobs duraveis no worker, sobre linhas que a base ja
  # tem. Zero chamadas a provider -- o listener e o unico que fala com um
  # dongle, e nenhum job o consegue arrancar.
  NEMSEI_V2_HUAWEI_SCADA_ROLLUP_ENABLED: "false"
  NEMSEI_V2_HUAWEI_SCADA_ROLLUP_CONNECTION_ID: ""
  NEMSEI_V2_HUAWEI_SCADA_ROLLUP_INTERVAL_MINUTES: "60"
  NEMSEI_V2_HUAWEI_SCADA_ROLLUP_LOOKBACK_DAYS: "2"
  NEMSEI_V2_HUAWEI_SCADA_RETENTION_ENABLED: "false"
  NEMSEI_V2_HUAWEI_SCADA_RETENTION_DAYS: "90"

x-v2-notification-environment: &v2-notification-environment
  NEMSEI_V2_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  NEMSEI_V2_NOTIFICATION_PROCESSING_ENABLED: "true"

services:
  postgres:
    image: postgres:16.11-bookworm@sha256:a2420e9555e2224583fe84d0bb3f0b967e69354ae3a0be55a9c14e251388c4eb
    restart: unless-stopped
    environment:
      POSTGRES_DB: nemsei_v2
      POSTGRES_USER: nemsei
      POSTGRES_PASSWORD_FILE: /run/secrets/v2_postgres_password
    volumes:
      - nemsei-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemsei -d nemsei_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
    secrets:
      - v2_postgres_password

  migrate:
    build: {context: ., dockerfile: Dockerfile.v2}
    profiles: ["manual"]
    # No restart policy, deliberately: this runs `alembic upgrade head` once
    # and exits. Auto-restarting it would mean a host reboot repeatedly
    # re-runs migrations against a database that may not be ready yet, or
    # worse, keeps retrying an intentionally-failed migration forever.
    env_file: ${NEMSEI_V2_ENV_FILE:-.env.v2}
    environment:
      <<: *v2-environment
      NEMSEI_V2_PROCESS_ROLE: migrate
    secrets:
      - v2_database_url
    depends_on: {postgres: {condition: service_healthy}}
    command: alembic upgrade head

  web:
    build: {context: ., dockerfile: Dockerfile.v2}
    restart: unless-stopped
    env_file: ${NEMSEI_V2_ENV_FILE:-.env.v2}
    environment:
      <<: *v2-environment
      NEMSEI_V2_PROCESS_ROLE: web
    secrets:
      - v2_database_url
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:${NEMSEI_V2_WEB_PORT:-5002}:5000"]
    command: gunicorn -w 1 --threads 2 -b 0.0.0.0:5000 nemsei.wsgi:app

  scheduler:
    build: {context: ., dockerfile: Dockerfile.v2}
    restart: unless-stopped
    env_file: ${NEMSEI_V2_ENV_FILE:-.env.v2}
    environment:
      <<: [*v2-environment, *v2-fusionsolar-environment, *v2-sigenergy-environment, *v2-notification-environment, *v2-huawei-scada-environment]
      NEMSEI_V2_PROCESS_ROLE: scheduler
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets:
      - v2_database_url
      - v1_broker_token
      - fusionsolar_primary_username
      - fusionsolar_primary_password
      - telegram_bot_token
      - sigenergy_primary_app_key
      - sigenergy_primary_app_secret
    depends_on: {postgres: {condition: service_healthy}}
    command: python -m nemsei.jobs.scheduler

  worker:
    build: {context: ., dockerfile: Dockerfile.v2}
    restart: unless-stopped
    env_file: ${NEMSEI_V2_ENV_FILE:-.env.v2}
    environment:
      <<: [*v2-environment, *v2-fusionsolar-environment, *v2-sigenergy-environment, *v2-notification-environment, *v2-huawei-scada-environment]
      NEMSEI_V2_PROCESS_ROLE: worker
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets:
      - v2_database_url
      - v1_broker_token
      - fusionsolar_primary_username
      - fusionsolar_primary_password
      - telegram_bot_token
      - sigenergy_primary_app_key
      - sigenergy_primary_app_secret
    depends_on: {postgres: {condition: service_healthy}}
    command: python -m nemsei.jobs.worker

  # O processo dedicado do Huawei SCADA. Servico proprio, e nao uma thread do
  # gunicorn, por uma razao concreta: o gunicorn pode reiniciar ou multiplicar
  # workers a qualquer momento, e cada um desses eventos ou disputa a mesma
  # porta TCP ou abre um segundo listener que responde a metade dos dongles.
  #
  # UM SO BINDING. Este e o unico servico que publica a porta, e o codigo
  # ainda toma um advisory lock do Postgres sobre o id da ligacao -- isso
  # apanha o caso que a porta nao apanha: um segundo listener noutra maquina
  # apontado a mesma ligacao, que duplicaria todas as amostras sem colisao
  # nenhuma para dar por isso.
  #
  # Fica atras de um profile: nao arranca com o `up -d web scheduler worker`
  # canonico. Ligar de proposito com
  #   docker compose -f docker-compose.v2.yml --env-file .env.v2 \
  #     --profile huawei-scada up -d --build scada-listener
  #
  # O endereco e a porta publicados vem do ambiente e o valor por omissao e
  # 127.0.0.1 -- so loopback. Para receber o dongle atraves do NAT do router e
  # preciso dizer explicitamente em que interface e que porta escutar; nenhum
  # endereco publico, nem porta publica, esta escrito em codigo nem aqui.
  #
  # TLS: nao ha. O piloto corre em claro, o que significa que quem esteja no
  # caminho ve as leituras e pode falsificar respostas. Ver a seccao de riscos
  # em docs/v2/HUAWEI_SCADA.md antes de por isto em producao.
  scada-listener:
    build: {context: ., dockerfile: Dockerfile.v2}
    profiles: ["huawei-scada"]
    restart: unless-stopped
    env_file: ${NEMSEI_V2_ENV_FILE:-.env.v2}
    environment:
      <<: [*v2-environment, *v2-huawei-scada-environment]
      NEMSEI_V2_PROCESS_ROLE: scada_listener
      NEMSEI_V2_HUAWEI_SCADA_LISTENER_ENABLED: "true"
      NEMSEI_V2_HUAWEI_SCADA_LISTENER_CONNECTION_ID: ${NEMSEI_V2_HUAWEI_SCADA_CONNECTION_ID:-}
      NEMSEI_V2_HUAWEI_SCADA_LISTENER_PORT: "1502"
      NEMSEI_V2_HUAWEI_SCADA_POLL_INTERVAL_SECONDS: ${NEMSEI_V2_HUAWEI_SCADA_POLL_INTERVAL_SECONDS:-30}
      NEMSEI_V2_HUAWEI_SCADA_IDLE_TIMEOUT_SECONDS: ${NEMSEI_V2_HUAWEI_SCADA_IDLE_TIMEOUT_SECONDS:-300}
      NEMSEI_V2_HUAWEI_SCADA_MAX_SESSIONS: ${NEMSEI_V2_HUAWEI_SCADA_MAX_SESSIONS:-32}
    secrets:
      - v2_database_url
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["${NEMSEI_V2_SCADA_BIND_ADDRESS:-127.0.0.1}:${NEMSEI_V2_SCADA_BIND_PORT:-1502}:1502"]
    command: python -m nemsei.integrations.huawei_scada.listener

volumes:
  nemsei-v2-postgres-data:

secrets:
  v2_database_url:
    file: ${NEMSEI_V2_DATABASE_URL_SECRET_FILE:?set NEMSEI_V2_DATABASE_URL_SECRET_FILE}
  v2_postgres_password:
    file: ${NEMSEI_V2_POSTGRES_PASSWORD_SECRET_FILE:?set NEMSEI_V2_POSTGRES_PASSWORD_SECRET_FILE}
  # V1<->V2 FusionSolar ownership coordination. Never the FusionSolar
  # credential itself -- just the bearer token for the narrow lease API in
  # docker-compose.v1-ownership-broker.yml.
  v1_broker_token:
    file: ./runtime/fusionsolar_ownership_broker/token.secret
  # The one shared FusionSolar account's credential, per
  # docs/v2/FUSIONSOLAR_OWNERSHIP_WINDOW.md -- same account V1 uses,
  # coordinated through the ownership broker rather than a second account.
  fusionsolar_primary_username:
    file: ./secrets/fusionsolar_primary_username
  fusionsolar_primary_password:
    file: ./secrets/fusionsolar_primary_password
  # D4: o token do bot de Telegram. Sem este segredo montado,
  # notifications/telegram_client.py devolve o mock e o processo nao consegue
  # enviar nada -- e a garantia que substituiu o "nao existe codigo HTTP" do D3.
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  sigenergy_primary_app_key:
    file: ./secrets/sigenergy_primary_app_key
  sigenergy_primary_app_secret:
    file: ./secrets/sigenergy_primary_app_secret
