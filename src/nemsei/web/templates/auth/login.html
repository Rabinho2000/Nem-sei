<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#333e48">
    <title>Entrar · Solcor O&amp;M</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='solcor-logo.png') }}">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-card">
        <span class="brand login-brand">
          <img class="brand-logo" src="{{ url_for('static', filename='solcor-logo.png') }}" alt="Solcor" width="527" height="147">
          <span class="brand-rule" aria-hidden="true"></span>
          <span><strong>O&amp;M</strong><small>Operações</small></span>
        </span>
        <h1>Entrar</h1>
        {% for category, message in get_flashed_messages(with_categories=true) %}
          <p class="flash {{ category }}">{{ message }}</p>
        {% endfor %}
        <form class="stack-form" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="next" value="{{ next }}">
          <label>Utilizador <input name="username" autocomplete="username" required autofocus></label>
          <label>Palavra-passe <input name="password" type="password" autocomplete="current-password" required></label>
          <button class="button primary login-submit" type="submit">Entrar</button>
        </form>
      </div>
      <p class="login-foot">Plataforma interna de operações e manutenção da Solcor.</p>
    </main>
  </body>
</html>
