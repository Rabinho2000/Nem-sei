{% extends "base.html" %}{% block content %}<h1>Provider connections</h1><ul>{% for connection in connections %}<li>{{ connection.display_name }} — {{ connection.provider_code }} — {{ connection.configuration_status }}</li>{% else %}<li>No connections.</li>{% endfor %}</ul><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><select name="provider_code"><option value="fusionsolar">FusionSolar</option><option value="sigenergy">Sigenergy</option><option value="sma">SMA</option></select><input name="connection_key" required placeholder="Connection key"><input name="display_name" required placeholder="Display name"><input name="account_reference" placeholder="Account reference"><input name="region" placeholder="Region"><input name="credential_reference" placeholder="Credential reference"><button>Create</button></form>{% endblock %}
