{% extends "base.html" %}{% block content %}<h1>Assets</h1><p><a href="{{ url_for('assets.new_asset') }}">Create asset</a></p><ul>{% for asset in assets %}<li><a href="{{ url_for('assets.asset_detail', asset_id=asset.id) }}">{{ asset.canonical_name }}</a> — {{ asset.lifecycle_status }}</li>{% else %}<li>No assets.</li>{% endfor %}</ul>{% endblock %}
