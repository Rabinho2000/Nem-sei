{% extends "base.html" %}
{% block content %}
<header class="page-header"><div><a class="back-link" href="{{ url_for('assets.list_assets') }}">← Centrais</a><h1>Nova central</h1><p class="page-intro">Adiciona uma entidade canónica ao portfólio.</p></div></header>
<section class="panel form-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Nome da central<input name="canonical_name" required></label><label>Organização<select name="owner_id"><option value="">—</option>{% for organization in organizations %}<option value="{{ organization.id }}">{{ organization.display_name }}</option>{% endfor %}</select></label><label>Estado do ciclo de vida<select name="lifecycle_status"><option value="unknown">Desconhecida</option><option value="active">Ativa</option><option value="inactive">Inativa</option><option value="decommissioned">Desativada</option></select></label><label>Potência DC (kW)<input name="installed_dc_power_kw" inputmode="decimal"></label><label>País<input name="country_code" maxlength="2" placeholder="PT"></label><label>Fuso horário<input name="timezone" value="Europe/Lisbon"></label><label>Localidade<input name="locality"></label><label>Morada<input name="address"></label></div><label>Notas técnicas<textarea name="technical_notes"></textarea></label><div class="form-actions"><a class="button secondary" href="{{ url_for('assets.list_assets') }}">Cancelar</a><button class="button primary" type="submit">Criar central</button></div></form></section>
{% endblock %}
