{% extends "base.html" %}{% block content %}<h1>Create asset</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name <input name="canonical_name" required></label><label>Owner <select name="owner_id"><option value=""></option>{% for owner in organizations %}<option value="{{ owner.id }}">{{ owner.display_name }}</option>{% endfor %}</select></label><label>Lifecycle <select name="lifecycle_status">{% for status in ('unknown','active','inactive','decommissioned') %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></label><label>Country <input name="country_code" maxlength="2"></label><label>Timezone <input name="timezone" value="Europe/Lisbon"></label><label>DC kW <input name="installed_dc_power_kw"></label><label>Locality <input name="locality"></label><label>Address <input name="address"></label><label>Technical notes <textarea name="technical_notes"></textarea></label><button>Create</button></form>{% endblock %}
