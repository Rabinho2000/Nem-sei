name: nem-sei-preview

services:
  monitoring-board:
    build: .
    image: nem-sei-preview-app:local
    restart: unless-stopped
    env_file:
      - .env.preview
    environment:
      APP_ENV: preview
      DATA_DIR: /data
      EXTERNAL_ACTIONS_ENABLED: "false"
      FUSIONSOLAR_DIAGNOSTICS_SYNC_ENABLED: "false"
      FUSIONSOLAR_PRODUCTION_SYNC_ENABLED: "false"
      PREVIEW_BANNER: "true"
      SCHEDULER_ENABLED: "false"
      SESSION_COOKIE_SECURE: "false"
      SIGENERGY_ENABLED: "false"
      TELEGRAM_ALERTS_ENABLED: "false"
      TELEGRAM_DAILY_SUMMARY_ENABLED: "false"
      TMPDIR: /preview-tmp
    volumes:
      - ./runtime:/data
      - ./runtime/tmp:/preview-tmp
    command: gunicorn -w 1 --threads 4 -b 0.0.0.0:5000 app:app
    networks:
      - preview-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:5000/login", timeout=5);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 20s

  sigenergy-preview-sync:
    image: nem-sei-preview-app:local
    profiles:
      - sigenergy-preview
    restart: "no"
    env_file:
      - .env.sigenergy-preview
    environment:
      APP_ENV: preview
      DATA_DIR: /data
      EXTERNAL_ACTIONS_ENABLED: "false"
      FUSIONSOLAR_DIAGNOSTICS_SYNC_ENABLED: "false"
      FUSIONSOLAR_PASSWORD: ""
      FUSIONSOLAR_PRODUCTION_SYNC_ENABLED: "false"
      FUSIONSOLAR_USERNAME: ""
      OPENROUTESERVICE_API_KEY: ""
      PREVIEW_BANNER: "true"
      SCHEDULER_ENABLED: "false"
      SIGENERGY_ENABLED: "false"
      SIGENERGY_ONBOARDING_ENABLED: "false"
      SIGENERGY_PRODUCTION_MIN_INTERVAL_SECONDS: "300"
      TELEGRAM_ALERTS_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      TELEGRAM_DAILY_SUMMARY_ENABLED: "false"
      TMPDIR: /tmp
    volumes:
      - ./runtime:/data
    command:
      - python
      - -m
      - monitoring_board.sigenergy_preview_worker
      - check
    networks:
      - preview-egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  preview-gateway:
    build:
      context: ./docker/preview-gateway
    restart: unless-stopped
    depends_on:
      monitoring-board:
        condition: service_healthy
    ports:
      - "0.0.0.0:5002:8080"
    networks:
      - preview-internal
      - preview-edge
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/login
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 10s

networks:
  preview-internal:
    internal: true
  preview-edge:
    driver: bridge
  preview-egress:
    driver: bridge
